name: install prompt

on:
  push:
    paths:
      - README.md
      - skills-ref/INSTALL_PROMPT.md
      - .github/scripts/check-install-prompt.sh
      - .github/workflows/install-prompt.yml
  pull_request:
    paths:
      - README.md
      - skills-ref/INSTALL_PROMPT.md
      - .github/scripts/check-install-prompt.sh
      - .github/workflows/install-prompt.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare installer prompts
        run: .github/scripts/check-install-prompt.sh
